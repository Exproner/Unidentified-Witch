<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Light Novel Website</title>
<style>
    body {
        font-family: 'Helvetica Neue 5';
        margin: 0;
        background-color: #ffffff;
    }

    nav {
        background-color: #4c4f9d;
        padding: 15px 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 0; /* ✅ lurus tanpa lengkungan */
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        text-align: center;
        position: sticky;
        top: 0;
        z-index: 100;
    }

    .logo-text {
        font-size: clamp(1.8rem, 5vw, 2.5rem);
        font-weight: bold;
        font-family: 'helvetica neue 5';
        background: linear-gradient(270deg, white, rgb(203, 240, 247));
        background-size: 600% 600%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: gradientMove 3s ease infinite;
        /* ✅ bayangan hanya di bawah */
    text-shadow: 0 3px 4px rgba(0,0,0,0.2);
    }

    @keyframes gradientMove {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    .content-section {
    background: url("unidentified_witch_bg.jpg") no-repeat center center;
    background-size: cover;    
    background-repeat: no-repeat;   /* biar nggak diulang */
    background-color: #000;         /* ruang kosong jadi hitam */
    aspect-ratio: 1600 / 700;       /* pakai rasio asli gambar */
    width: 100%;

    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    color: white;
    text-align: center;
    padding: 40px 20px 30px;
    box-sizing: border-box;
}



    /* Button Style */
    .novel-btn {
        display: inline-block;
        background: #00bfff;
        color: white;
        text-decoration: none;
        padding: 12px 24px;
        border-radius: 25px;
        font-size: 1rem;
        font-weight: bold;
        transition: background 0.3s ease, transform 0.2s ease;
        margin-bottom: 15px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }
    .novel-btn:hover {
        background: #0099cc;
        transform: scale(1.05);
    }

    /* Progress Bar */
    .progress-wrapper {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .progress-container {
        width: 80%;
        max-width: 600px;
        background: #e0e0e0;
        border-radius: 20px;
        overflow: hidden;
        margin-top: 5px;
        box-shadow: inset 0 2px 6px rgba(0,0,0,0.3);
    }
    .progress-bar {
        height: 20px;
        width: 0;
        background: #00bfff;
        border-radius: 20px;
        transition: width 1s ease;
    }
    .progress-text {
        margin-top: 6px;
        font-size: 1rem;
    }

   /* (animasi pembatas) Divider default: hidden */
.mobile-only {
    display: none;
}

/* Tampilkan hanya di HP */
@media (max-width: 768px) {
    .mobile-only {
        display: flex; /* aktifkan divider */
    }
}

/* === Section Divider === */
.section-divider {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 15px 0;
    position: relative;
}
.divider-line {
    height: 3px;
    width: 80px;
    background: linear-gradient(to right, transparent, #00bfff, transparent);
}
.divider-icon {
    margin: 0 12px;
    color: #00bfff;
    font-size: 25px;
    animation: bounce 2s infinite;
}
@keyframes bounce {
    0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-8px); }
    60% { transform: translateY(-4px); }
}


    /* 📱 Responsif tetap aktif */
@media (max-width: 768px) {
    .content-section {
        padding: 20px 10px 25px;
        background-size: cover;   /* tetap cover, biar full layar hp */
    }

    .novel-btn {
        font-size: 0.85rem;
        padding: 8px 16px;
    }

    .progress-text {
        font-size: 0.85rem;
    }

    .progress-container {
        width: 95%;
    }
}

@media (max-width: 768px) {
    #progressWrapper {
        margin-top: 5px;      /* ✅ kasih jarak dari section */
        padding: 10px;         /* biar nggak mepet isinya */
        transform: scale(0.9); /* ✅ perkecil sedikit ukurannya */
    }

    #progressWrapper h2 {
        font-size: 1rem;       /* judul lebih kecil */
    }

    .progress-container {
        width: 85%;            /* lebih ramping */
    }

    .novel-btn {
        font-size: 0.8rem;
        padding: 6px 14px;
    }

    .progress-text {
        font-size: 0.8rem;
    }
}

/* highlight-section sebagai footer */
.highlight-section {
    background-color: #4c4f9d;
    min-height: 100px;      /* tinggi fleksibel */
    width: 100%;            /* full lebar */
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px 15px;
    margin-top: 0;       /* jarak dari atas section sebelumnya */
    margin-bottom: 0;       /* tidak ada jarak bawah */
    text-align: center;
    color: white;
    font-size: clamp(0.9rem, 2vw, 1.1rem);
    box-sizing: border-box;

    position: relative;     /* default: ngikut konten */
}



</style>
</head>
<body>

<!-- Navbar -->
<nav>
    <div class="logo-text">UNIDENTIFIED WITCH</div>
</nav>

<!-- Content Section -->
<section class="content-section" id="contentSection">
    <!-- hapus progress-wrapper dari sini -->
</section>

<!-- taruh progress-wrapper di luar section, default posisinya -->
<div class="progress-wrapper" id="progressWrapper">
     <!-- Divider ATAS -->
    <div class="section-divider mobile-only">
        <div class="divider-line"></div>
        <div class="divider-icon">✦</div>
        <div class="divider-line"></div>
    </div>
    <a href="novel.html" class="novel-btn">Pergi ke Light Novel</a>
    <h2>Progress Cerita</h2>
    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="progress-text" id="progressText">Loading...</div>
     <!-- Divider BAWAH -->
    <div class="section-divider mobile-only">
        <div class="divider-line"></div>
        <div class="divider-icon">✦</div>
        <div class="divider-line"></div>
    </div>
</div>


<script>
function moveProgress() {
    const contentSection = document.getElementById("contentSection");
    const progressWrapper = document.getElementById("progressWrapper");

    if (window.innerWidth <= 768) {
        // kalau belum dipindah, pindahkan progress-wrapper ke body setelah section
        if (progressWrapper.parentElement === contentSection) {
            contentSection.insertAdjacentElement("afterend", progressWrapper);
        }
    } else {
        // kalau layar gede, kembalikan progress-wrapper ke dalam section
        if (progressWrapper.parentElement !== contentSection) {
            contentSection.appendChild(progressWrapper);
        }
    }
}

// jalankan saat load & resize
window.addEventListener("load", moveProgress);
window.addEventListener("resize", moveProgress);
</script>


<script>
fetch("chapters.html")
    .then(response => response.text())
    .then(data => {
        let parser = new DOMParser();
        let doc = parser.parseFromString(data, "text/html");

        let chapters = doc.querySelectorAll("li");

        let uploaded = chapters.length;
        let total = 100;
        let percent = Math.round((uploaded / total) * 100);

        document.getElementById("progressBar").style.width = percent + "%";
        document.getElementById("progressText").innerText = `${percent}%`;
    })
    .catch(err => {
        console.error("Error:", err);
        document.getElementById("progressText").innerText = "Gagal memuat progress.";
    });
</script>

<!-- highlight-section -->
<section class="highlight-section">
 <h1 center>Unidentified Witch</h1>
</section>


</body>
</html>
